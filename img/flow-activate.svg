<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 940" font-family="system-ui,-apple-system,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">
  <title>KMS 一句命令激活流程图</title>
  <defs>
    <radialGradient id="fglow1" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#fb7185" stop-opacity=".14"/><stop offset="1" stop-color="#fb7185" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="fglow2" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#2dd4bf" stop-opacity=".12"/><stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/>
    </radialGradient>
    <marker id="aGray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0L10,5L0,10z" fill="#94a3be"/>
    </marker>
    <marker id="aAmber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0L10,5L0,10z" fill="#fbbf24"/>
    </marker>
    <marker id="aRose" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0L10,5L0,10z" fill="#fb7185"/>
    </marker>
    <marker id="aOrange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0L10,5L0,10z" fill="#fb923c"/>
    </marker>
  </defs>

  <rect x="12" y="12" width="1176" height="916" rx="24" fill="#0e1628" stroke="rgba(148,163,190,.28)"/>
  <circle cx="1050" cy="90" r="260" fill="url(#fglow1)"/>
  <circle cx="180" cy="840" r="240" fill="url(#fglow2)"/>

  <!-- header -->
  <rect x="60" y="42" width="66" height="26" rx="13" fill="rgba(251,113,133,.14)" stroke="rgba(251,113,133,.4)"/>
  <text x="93" y="60" text-anchor="middle" font-size="11" font-weight="700" letter-spacing="2" fill="#fb923c">FLOW</text>
  <text x="60" y="106" font-size="26" font-weight="800" fill="#e7ecf6">KMS 激活流程图</text>
  <text x="60" y="132" font-size="13" fill="#2dd4bf" font-family="Consolas,'Cascadia Mono',monospace">slmgr /skms s.ikms.eu.org &amp;&amp; slmgr /ato</text>

  <!-- start -->
  <rect x="330" y="156" width="380" height="46" rx="23" fill="rgba(45,212,191,.08)" stroke="#2dd4bf" stroke-width="1.4"/>
  <text x="520" y="185" text-anchor="middle" font-size="14" font-weight="600" fill="#2dd4bf">开始 · 已安装 VOL 版 Windows / Office</text>
  <line x1="520" y1="202" x2="520" y2="224" stroke="#94a3be" stroke-width="1.6" marker-end="url(#aGray)"/>

  <!-- decision 1: VOL? -->
  <polygon points="380,294 520,230 660,294 520,358" fill="rgba(96,165,250,.08)" stroke="#60a5fa" stroke-width="1.4"/>
  <text x="520" y="290" text-anchor="middle" font-size="14" font-weight="600" fill="#e7ecf6">系统是 VOL 批量版吗</text>
  <text x="520" y="312" text-anchor="middle" font-size="11" fill="#6e7a94">business / vol / 批量版</text>
  <text x="358" y="283" text-anchor="middle" font-size="12" font-weight="600" fill="#fbbf24">否</text>
  <line x1="380" y1="294" x2="346" y2="294" stroke="#fbbf24" stroke-width="1.6" marker-end="url(#aAmber)"/>

  <!-- RTL side card -->
  <rect x="60" y="238" width="280" height="112" rx="14" fill="rgba(251,191,36,.06)" stroke="#fbbf24" stroke-width="1.3" stroke-dasharray="5 4"/>
  <text x="80" y="266" font-size="13" font-weight="700" fill="#fbbf24">RTL 零售 / 家庭版</text>
  <text x="80" y="292" font-size="12" fill="#a3adc4">更换密钥升级为 VOL 版，</text>
  <text x="80" y="312" font-size="12" fill="#a3adc4">升级密钥见教程「特例」章节</text>
  <path d="M200,350 V378 H508" fill="none" stroke="#fbbf24" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#aAmber)"/>

  <!-- main flow -->
  <text x="536" y="378" font-size="12" font-weight="600" fill="#34d399">是</text>
  <line x1="520" y1="358" x2="520" y2="386" stroke="#94a3be" stroke-width="1.6" marker-end="url(#aGray)"/>

  <rect x="320" y="392" width="400" height="64" rx="14" fill="rgba(255,255,255,.03)" stroke="rgba(148,163,190,.4)"/>
  <rect x="336" y="412" width="4" height="24" rx="2" fill="#fb923c"/>
  <text x="532" y="420" text-anchor="middle" font-size="15" font-weight="600" fill="#e7ecf6">以管理员身份打开「命令提示符」</text>
  <text x="532" y="442" text-anchor="middle" font-size="11" fill="#6e7a94">开始菜单搜索 cmd → 右键 → 以管理员身份运行</text>
  <line x1="520" y1="456" x2="520" y2="474" stroke="#94a3be" stroke-width="1.6" marker-end="url(#aGray)"/>

  <rect x="290" y="480" width="460" height="68" rx="12" fill="#0a0f1d" stroke="rgba(148,163,190,.45)"/>
  <text x="306" y="500" font-size="11" fill="#6e7a94" letter-spacing="1">命令提示符（管理员）</text>
  <text x="520" y="527" text-anchor="middle" font-size="14" fill="#2dd4bf" font-family="Consolas,'Cascadia Mono',monospace">slmgr /skms s.ikms.eu.org &amp;&amp; slmgr /ato</text>
  <line x1="520" y1="548" x2="520" y2="566" stroke="#94a3be" stroke-width="1.6" marker-end="url(#aGray)"/>

  <!-- decision 2: success? -->
  <polygon points="388,634 520,572 652,634 520,696" fill="rgba(251,113,133,.08)" stroke="#fb7185" stroke-width="1.4"/>
  <text x="520" y="640" text-anchor="middle" font-size="15" font-weight="600" fill="#e7ecf6">激活成功？</text>

  <!-- success -->
  <text x="536" y="716" font-size="12" font-weight="600" fill="#34d399">是</text>
  <line x1="520" y1="696" x2="520" y2="724" stroke="#34d399" stroke-width="1.6" marker-end="url(#aGray)"/>
  <rect x="310" y="730" width="420" height="78" rx="16" fill="rgba(52,211,153,.08)" stroke="#34d399" stroke-width="1.4"/>
  <circle cx="348" cy="769" r="17" fill="rgba(52,211,153,.15)" stroke="#34d399" stroke-width="1.6"/>
  <path d="M340,769 l6,7 l12,-13" fill="none" stroke="#34d399" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="528" y="763" text-anchor="middle" font-size="15" font-weight="700" fill="#e7ecf6">激活成功，无需任何后续操作</text>
  <text x="528" y="786" text-anchor="middle" font-size="12" fill="#a3adc4">每 7 天自动续期 · 180 天有效期内保持永久激活</text>

  <!-- failure branch -->
  <text x="702" y="622" text-anchor="middle" font-size="12" font-weight="600" fill="#fb7185">否</text>
  <line x1="652" y1="634" x2="810" y2="634" stroke="#fb7185" stroke-width="1.6" marker-end="url(#aRose)"/>

  <rect x="816" y="452" width="336" height="330" rx="16" fill="rgba(251,146,60,.06)" stroke="rgba(251,146,60,.45)"/>
  <text x="840" y="486" font-size="15" font-weight="700" fill="#fb923c">排错清单</text>
  <circle cx="848" cy="514" r="3.5" fill="#fb923c"/>
  <text x="862" y="519" font-size="12" fill="#a3adc4">未以管理员身份运行 cmd</text>
  <text x="862" y="537" font-size="11" fill="#6e7a94">常见报错 0x80070005</text>
  <circle cx="848" cy="572" r="3.5" fill="#fb923c"/>
  <text x="862" y="577" font-size="12" fill="#a3adc4">系统 / Office 不是 VOL 版</text>
  <text x="862" y="595" font-size="11" fill="#6e7a94">家庭版需换密钥升级（见「特例」）</text>
  <circle cx="848" cy="630" r="3.5" fill="#fb923c"/>
  <text x="862" y="635" font-size="12" fill="#a3adc4">密钥被改动或卸载</text>
  <text x="862" y="653" font-size="11" fill="#6e7a94">安装对应 GVLK 密钥（附1 / 附2）</text>
  <circle cx="848" cy="688" r="3.5" fill="#fb923c"/>
  <text x="862" y="693" font-size="12" fill="#a3adc4">网络不通或防火墙拦截</text>
  <text x="862" y="711" font-size="11" fill="#6e7a94">服务器类系统需放行 ICMP（ping）</text>
  <text x="840" y="756" font-size="12" font-weight="600" fill="#fb923c">修复后重新执行命令 ↺</text>

  <!-- retry loop -->
  <path d="M984,452 V468 H560 V474" fill="none" stroke="#fb923c" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#aOrange)"/>
  <text x="772" y="461" font-size="11" fill="#fb923c">重试</text>

  <!-- footer -->
  <text x="600" y="894" text-anchor="middle" font-size="12" fill="#6e7a94">GVLK 密钥与详细排错见本页「附1 / 附2」与「激活失败如何排错」章节 · ikms.eu.org</text>
</svg>
