name: KMS 线路巡检

# 运行时统一使用北京时间（Asia/Shanghai），影响 date 命令、Node 的本地时间方法
# 与 git 提交时间戳；脚本写入 data/*.json 的时间由 scripts/kms-lib.mjs 统一转换
env:
  TZ: Asia/Shanghai

on:
  schedule:
    # GitHub Actions 的 cron 固定按 UTC 解析（不受上面 TZ 影响）。
    # */30 表示每 30 分钟触发，UTC 与北京（UTC+8）的分/时偏移为整 8 小时，
    # 因此实际触发时刻在北京时间同样是每小时的 :00 与 :30。
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      rebuild_private:
        description: "重建候选池加密数据（首次配置 CANDIDATES_SECRET 后勾选执行一次）"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: kms-health
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # 重建脚本需要 git log --grep 历史明文数据

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 重建候选池加密数据（手动触发且勾选时执行）
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.rebuild_private }}
        env:
          CANDIDATES_SECRET: ${{ secrets.CANDIDATES_SECRET }}
        run: node scripts/rebuild-private.mjs

      - name: 编译 vlmcs 检测工具
        run: |
          git clone --depth 1 https://github.com/Wind4/vlmcsd.git /tmp/vlmcsd
          make -C /tmp/vlmcsd vlmcs || make -C /tmp/vlmcsd
          VLMCS_PATH=""
          for p in /tmp/vlmcsd/vlmcs /tmp/vlmcsd/bin/vlmcs $(find /tmp/vlmcsd -type f -name vlmcs); do
            if file "$p" 2>/dev/null | grep -q ELF; then VLMCS_PATH="$p"; break; fi
          done
          if [ -z "$VLMCS_PATH" ]; then echo "vlmcs Linux binary not found"; exit 1; fi
          sudo install "$VLMCS_PATH" /usr/local/bin/vlmcs
          vlmcs -V 2>&1 | head -2 || true

      - name: 巡检全部线路（验证 + 延迟 + 自动替换失效线路）
        run: node scripts/kms-check.mjs
        env:
          CANDIDATES_SECRET: ${{ secrets.CANDIDATES_SECRET }}

      - name: 主线路 DNS 负载均衡（未配置密钥时自动跳过）
        run: node scripts/update-dns.mjs
        env:
          CANDIDATES_SECRET: ${{ secrets.CANDIDATES_SECRET }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          BALANCE_COUNT: "5"

      - name: 提交状态变更
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [[ -n "$(git status --porcelain data)" ]]; then
            git add data
            git commit -m "chore(kms): 巡检更新线路状态"
            for i in 1 2 3; do
              git push && break
              git pull --rebase origin main || (git rebase --abort; sleep 5)
            done
          else
            echo "本次巡检无状态变化，跳过提交"
          fi
