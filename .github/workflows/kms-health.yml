name: KMS 线路巡检

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kms-health
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 编译 vlmcs 检测工具
        run: |
          git clone --depth 1 https://github.com/hotbird64/vlmcsd.git /tmp/vlmcsd
          make -C /tmp/vlmcsd vlmcs
          sudo install /tmp/vlmcsd/bin/vlmcs /usr/local/bin/vlmcs
          vlmcs -x 2>&1 | head -3 || true

      - name: 巡检全部线路（验证 + 延迟 + 自动替换失效线路）
        run: node scripts/kms-check.mjs

      - name: 主线路 DNS 负载均衡（未配置密钥时自动跳过）
        run: node scripts/update-dns.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          BALANCE_COUNT: "5"

      - name: 提交状态变更
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [[ -n "$(git status --porcelain data/servers.json)" ]]; then
            git add data/servers.json
            git commit -m "chore(kms): 巡检更新线路状态"
            git push
          else
            echo "本次巡检无状态变化，跳过提交"
          fi
