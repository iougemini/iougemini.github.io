name: KMS 请求统计接收

on:
  repository_dispatch:
    types: [kms-stats]

permissions:
  contents: write

concurrency:
  group: kms-stats
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 合并统计数据
        env:
          PAYLOAD: ${{ toJSON(github.event.client_payload) }}
        run: node scripts/merge-stats.mjs

      - name: 提交
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/stats.json
          if [[ -z "$(git diff --cached --name-only)" ]]; then
            echo "统计数据无变化"
            exit 0
          fi
          git commit -m "chore(kms): 更新激活请求统计"
          for i in 1 2 3; do
            git push && break
            git pull --rebase origin main || (git rebase --abort; sleep 5)
          done
