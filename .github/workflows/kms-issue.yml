name: KMS 投稿检测

on:
  issues:
    types: [opened, edited, labeled, reopened]
  workflow_dispatch:
    inputs:
      issue_number:
        description: 要检测的 issue 编号（补跑用）
        required: false
        default: ""

permissions:
  contents: write
  issues: write

# 同一 issue 的多次触发（opened/edited/labeled/reopened）只跑最新一次，旧任务自动取消，避免并发竞态
concurrency:
  group: kms-issue-${{ github.event.issue.number || github.event.inputs.issue_number || 'manual' }}
  cancel-in-progress: true

jobs:
  process:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.action == 'labeled' && github.event.label.name == 'kms-submit') ||
      contains(github.event.issue.labels.*.name, 'kms-submit') ||
      contains(github.event.issue.body, '### 服务器地址')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 编译 vlmcs 检测工具
        run: |
          git clone --depth 1 https://github.com/Wind4/vlmcsd.git /tmp/vlmcsd
          make -C /tmp/vlmcsd vlmcs || make -C /tmp/vlmcsd
          VLMCS_PATH=""
          for p in /tmp/vlmcsd/vlmcs /tmp/vlmcsd/bin/vlmcs $(find /tmp/vlmcsd -type f -name vlmcs); do
            if file "$p" 2>/dev/null | grep -q ELF; then VLMCS_PATH="$p"; break; fi
          done
          if [ -z "$VLMCS_PATH" ]; then echo "vlmcs Linux binary not found"; exit 1; fi
          sudo install "$VLMCS_PATH" /usr/local/bin/vlmcs

      - name: 确保 kms-submit 标签存在（issue 表单不会自动创建新标签）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh label create "kms-submit" --description "KMS 服务器投稿" --color "0E8A16" -R "$GITHUB_REPOSITORY" 2>/dev/null || true

      - name: 检测投稿服务器
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number || github.event.inputs.issue_number }}
          COMMENT_FILE: /tmp/comment.md
        run: |
          if [ -z "$ISSUE_NUMBER" ]; then echo "未指定 issue 编号"; exit 0; fi
          ISSUE_BODY="$(gh issue view "$ISSUE_NUMBER" -R "$GITHUB_REPOSITORY" --json body --jq .body 2>/dev/null || true)"
          if ! printf '%s' "$ISSUE_BODY" | grep -q "### 服务器地址"; then echo "非投稿 issue（正文无投稿表单标记），跳过"; exit 0; fi
          export ISSUE_BODY
          node scripts/process-issue.mjs

      - name: 收录通过的服务器
        env:
          ISSUE_NUM: ${{ github.event.issue.number || github.event.inputs.issue_number }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [[ -z "$(git status --porcelain data/servers.json)" ]]; then
            echo "数据无变化（未通过验证、重复投稿或已处理过）"
            exit 0
          fi
          git add data/servers.json
          git commit -m "chore(kms): 收录投稿服务器（issue #$ISSUE_NUM）"
          # 巡检等任务可能并发更新过 servers.json，推送失败时合并远端后重试；
          # 冲突时保留本次收录（-X ours），对方的巡检状态更新下轮巡检会重写
          for i in 1 2 3; do
            if git push; then echo "push ok (attempt $i)"; exit 0; fi
            echo "push rejected (attempt $i), merging origin/main..."
            git fetch origin main
            git rebase origin/main 2>/dev/null || {
              git rebase --abort
              git merge origin/main -X ours -m "merge origin/main（冲突保留本次收录，issue #$ISSUE_NUM）"
            }
          done
          echo "push failed after 3 attempts"
          exit 1

      - name: 回复检测结果
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number || github.event.inputs.issue_number }}
        run: |
          if [ -s /tmp/comment.md ]; then
            gh issue comment "$ISSUE_NUMBER" -R "$GITHUB_REPOSITORY" --body-file /tmp/comment.md
          else
            echo "无新回复（该 issue 已处理过）"
          fi
